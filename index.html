<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TABA Rulebook 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@300;400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ── Admin login modal ─────────────────────────────────── -->
  <div id="admin-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="admin-modal-heading">
    <div class="admin-modal-backdrop" onclick="closeAdminModal()"></div>
    <div class="admin-modal-box">
      <button class="admin-modal-close" onclick="closeAdminModal()" aria-label="Close">✕</button>
      <div class="admin-modal-icon">🔒</div>
      <h2 id="admin-modal-heading">Admin Access</h2>
      <p>Enter your admin password to enable inline rule editing.</p>
      <form id="admin-login-form" onsubmit="adminLogin(event)" autocomplete="on">
        <input type="text" name="username" style="display:none" autocomplete="username" aria-hidden="true">
        <input type="password" id="admin-modal-pw" name="password" placeholder="Admin password" autocomplete="current-password">
        <button type="submit" id="admin-login-btn">Log in</button>
        <p id="admin-login-err" class="admin-modal-err" style="display:none"></p>
      </form>
    </div>
  </div>

  <!-- ── Admin banner (shown when authenticated) ───────────── -->
  <div id="admin-banner" style="display:none" role="status">
    <div class="admin-banner-left">
      <span class="admin-banner-dot"></span>
      <strong>Admin Mode</strong><span class="admin-banner-sep">—</span>inline editing enabled on all rules
    </div>
    <div class="admin-banner-right">
      <a href="/admin" class="admin-banner-link">Audit Log ↗</a>
      <button onclick="adminLogout()" class="admin-banner-logout">Log out</button>
    </div>
  </div>

  <!-- ── Edit drawer (slides up when ✎ Edit is clicked) ────── -->
  <div id="edit-drawer" style="display:none" role="complementary" aria-label="Rule editor">
    <div class="edit-drawer-header">
      <div class="edit-drawer-title-row">
        <span class="edit-drawer-label">Editing:</span>
        <span id="edit-drawer-title"></span>
      </div>
      <button onclick="closeEditDrawer()" class="edit-drawer-close" aria-label="Close editor">✕</button>
    </div>
    <div class="edit-drawer-body">
      <div id="edit-fields"></div>
      <div class="edit-drawer-actions">
        <button onclick="saveEdit()" class="edit-save-btn">Save Changes</button>
        <button onclick="revertEdit()" class="edit-revert-btn">Revert to Original</button>
        <span id="edit-status" class="edit-status-msg"></span>
      </div>
    </div>
  </div>

  <!-- ── App shell ─────────────────────────────────────────── -->
  <div id="app">
    <div id="loading">
      <span class="load-icon">⚾</span>
      <p id="load-status">Loading rulebook…</p>
    </div>
  </div>

  <div id="sidebar" style="display:none"></div>
  <main id="main" style="display:none"></main>

  <script>
    /* ── Admin mode: set BEFORE renderer.js loads ── */
    window.isAdminMode = !!localStorage.getItem('adminToken');
    if (window.isAdminMode) {
      document.getElementById('admin-banner').style.display = '';
      document.body.classList.add('admin-mode');
    }

    function _adminToken() { return localStorage.getItem('adminToken') || ''; }

    function showError(msg) {
      document.getElementById('load-status').innerHTML =
        '<span style="color:#c0392b;font-weight:bold">Error: ' + msg + '</span>';
      console.error('Rulebook error:', msg);
    }
    window._loaded = { rules: false, divisions: false, renderer: false };

    /* ── Admin modal ──────────────────────────────── */
    window.openAdminModal = function () {
      document.getElementById('admin-modal').style.display = '';
      setTimeout(() => document.getElementById('admin-modal-pw').focus(), 50);
    };

    function closeAdminModal() {
      document.getElementById('admin-modal').style.display = 'none';
      document.getElementById('admin-login-err').style.display = 'none';
      document.getElementById('admin-modal-pw').value = '';
    }

    async function adminLogin(e) {
      e.preventDefault();
      const pw  = document.getElementById('admin-modal-pw').value;
      const btn = document.getElementById('admin-login-btn');
      const err = document.getElementById('admin-login-err');
      btn.disabled = true; btn.textContent = 'Checking…';
      err.style.display = 'none';
      try {
        const res = await fetch('/api/audit-log', { headers: { 'Authorization': `Bearer ${pw}` } });
        if (res.ok) {
          localStorage.setItem('adminToken', pw);
          closeAdminModal();
          location.reload();
        } else {
          err.textContent = res.status === 401 ? 'Incorrect password.' : `Server error (${res.status}) — check Vercel env vars.`;
          err.style.display = '';
        }
      } catch {
        err.textContent = 'Connection error — try again.';
        err.style.display = '';
      } finally {
        btn.disabled = false; btn.textContent = 'Log in';
      }
    }

    function adminLogout() {
      localStorage.removeItem('adminToken');
      location.reload();
    }

    /* ── Edit drawer ──────────────────────────────── */
    let _editCtx = null;

    function _escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function _escText(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    const _SNIPPETS = {
      'callout-blue':  '<div class="callout blue">\n  <p>Text here.</p>\n</div>',
      'callout-red':   '<div class="callout red">\n  <p><strong>Note:</strong> Text here.</p>\n</div>',
      'callout-navy':  '<div class="callout navy">\n  <p><strong>Heading:</strong></p>\n  <ol class="nl">\n    <li>Item one</li>\n    <li>Item two</li>\n  </ol>\n</div>',
      'ul':            '<ul class="rl">\n  <li>Item one</li>\n  <li>Item two</li>\n</ul>',
      'ol':            '<ol class="nl">\n  <li>Item one</li>\n  <li>Item two</li>\n</ol>',
      'table':         '<table>\n  <thead><tr><th>Column</th><th>Value</th></tr></thead>\n  <tbody>\n    <tr><td class="hi">Row 1</td><td>Value</td></tr>\n  </tbody>\n</table>',
      'sub-rule':      '<div class="sub-rule">\n  <div class="sub-rule-title">Section Title</div>\n  <p>Content here.</p>\n</div>',
      'note':          '<p class="note">Additional note here.</p>',
    };

    function _insertSnippet(ta, text) {
      const s = ta.selectionStart, e = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
      ta.selectionStart = ta.selectionEnd = s + text.length;
      ta.dispatchEvent(new Event('input')); ta.focus();
    }

    function _wrapSelection(ta, before, after) {
      const s = ta.selectionStart, e = ta.selectionEnd;
      const sel = ta.value.slice(s, e) || 'text';
      const rep = before + sel + after;
      ta.value = ta.value.slice(0, s) + rep + ta.value.slice(e);
      ta.selectionStart = s; ta.selectionEnd = s + rep.length;
      ta.dispatchEvent(new Event('input')); ta.focus();
    }

    function _contentField(val) {
      return `<div class="edit-field">
        <label>Content (HTML)</label>
        <div class="editor-toolbar">
          <button type="button" class="tb-btn" data-wrap-b="&lt;strong&gt;" data-wrap-a="&lt;/strong&gt;">Bold</button>
          <button type="button" class="tb-btn" data-wrap-b="&lt;a href=&quot;#&quot; class=&quot;bcm-link&quot;&gt;" data-wrap-a="&lt;/a&gt;">BC Link</button>
          <span class="tb-sep"></span>
          <button type="button" class="tb-btn" data-snip="callout-blue">Callout blue</button>
          <button type="button" class="tb-btn" data-snip="callout-red">Callout red</button>
          <button type="button" class="tb-btn" data-snip="callout-navy">Callout navy</button>
          <span class="tb-sep"></span>
          <button type="button" class="tb-btn" data-snip="ul">Bullet list</button>
          <button type="button" class="tb-btn" data-snip="ol">Numbered list</button>
          <button type="button" class="tb-btn" data-snip="table">Table</button>
          <span class="tb-sep"></span>
          <button type="button" class="tb-btn" data-snip="sub-rule">Sub-rule</button>
          <button type="button" class="tb-btn" data-snip="note">Note</button>
        </div>
        <textarea id="ef-content" rows="10">${_escText(val)}</textarea>
        <div class="editor-preview-label">Preview</div>
        <div class="editor-preview-live" id="ef-content-preview">${val}</div>
      </div>`;
    }

    function _attachEditorHandlers() {
      const ta = document.getElementById('ef-content');
      if (!ta) return;
      const preview = document.getElementById('ef-content-preview');
      ta.addEventListener('input', () => { preview.innerHTML = ta.value; });
      document.querySelectorAll('#edit-fields .tb-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.snip)  _insertSnippet(ta, _SNIPPETS[btn.dataset.snip] || '');
          if (btn.dataset.wrapB) _wrapSelection(ta, btn.dataset.wrapB.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'), btn.dataset.wrapA.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'));
        });
      });
    }

    window.openEditDrawer = function (dataset) {
      const { editType, editId, divKey } = dataset;
      const div = window.TABADivisions[divKey];
      if (!div) return;

      let current = {};
      if (editType === 'additions') {
        current = (div.additions || []).find(a => a.id === editId) || {};
      } else {
        current = (div.overrides || {})[editId] || {};
      }
      _editCtx = { divKey, sectionType: editType, sectionId: editId };

      document.getElementById('edit-drawer-title').textContent = current.title || current.label || editId;
      document.getElementById('edit-status').textContent = '';

      const field = (id, label, val, tag = 'textarea', rows = 3) => {
        const input = tag === 'input'
          ? `<input type="text" id="ef-${id}" value="${_escAttr(val)}">`
          : `<textarea id="ef-${id}" rows="${rows}">${_escText(val)}</textarea>`;
        return `<div class="edit-field"><label>${label}</label>${input}</div>`;
      };

      let html = '';
      if (editType === 'additions') {
        html += field('badge',   'Badge label',     current.badge   || '', 'input');
        html += _contentField(current.content || '');
      } else {
        html += field('label',          'Panel label',      current.label          || '', 'input');
        html += field('bcMinorSummary', 'BC Minor summary',  current.bcMinorSummary || '', 'textarea', 3);
        html += field('tabaSummary',    'Division summary',  current.tabaSummary    || '', 'textarea', 3);
        html += _contentField(current.content || '');
      }

      document.getElementById('edit-fields').innerHTML = html;
      _attachEditorHandlers();
      document.getElementById('edit-drawer').style.display = '';
      document.getElementById('edit-drawer').scrollTop = 0;
    };

    function closeEditDrawer() {
      document.getElementById('edit-drawer').style.display = 'none';
      _editCtx = null;
    }

    async function saveEdit() {
      if (!_editCtx) return;
      const { divKey, sectionType, sectionId } = _editCtx;
      const changes = {};
      ['badge', 'label', 'content', 'bcMinorSummary', 'tabaSummary'].forEach(f => {
        const el = document.getElementById('ef-' + f);
        if (el) changes[f] = el.value;
      });

      const statusEl = document.getElementById('edit-status');
      statusEl.textContent = 'Saving…';
      try {
        const res = await fetch('/api/save-amendment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${_adminToken()}` },
          body: JSON.stringify({ divisionKey: divKey, sectionType, sectionId, changes })
        });
        if (res.ok) {
          statusEl.textContent = '✓ Saved — reloading…';
          setTimeout(() => location.reload(), 700);
        } else {
          const d = await res.json().catch(() => ({}));
          statusEl.textContent = `Error: ${d.error || res.status}`;
        }
      } catch { statusEl.textContent = 'Connection error.'; }
    }

    async function revertEdit() {
      if (!_editCtx) return;
      if (!confirm('Remove all amendments to this rule and restore the original wording?')) return;
      const { divKey, sectionType, sectionId } = _editCtx;
      const statusEl = document.getElementById('edit-status');
      statusEl.textContent = 'Reverting…';
      try {
        const res = await fetch('/api/revert-amendment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${_adminToken()}` },
          body: JSON.stringify({ divisionKey: divKey, sectionType, sectionId })
        });
        if (res.ok) {
          statusEl.textContent = '✓ Reverted — reloading…';
          setTimeout(() => location.reload(), 700);
        } else {
          const d = await res.json().catch(() => ({}));
          statusEl.textContent = `Error: ${d.error || res.status}`;
        }
      } catch { statusEl.textContent = 'Connection error.'; }
    }
  </script>

  <script src="js/bc-minor-rules.js"
    onload="window._loaded.rules = true; document.getElementById('load-status').textContent = 'Loaded rules…'"
    onerror="showError('Failed to load bc-minor-rules.js — check file path')">
  </script>

  <script src="js/taba-divisions.js"
    onload="window._loaded.divisions = true; document.getElementById('load-status').textContent = 'Loaded divisions…'"
    onerror="showError('Failed to load taba-divisions.js — check file path')">
  </script>

  <script src="js/renderer.js"
    onload="window._loaded.renderer = true; document.getElementById('load-status').textContent = 'Starting…'"
    onerror="showError('Failed to load renderer.js — check file path')">
  </script>

  <script>
    try {
      if (!window._loaded.rules)           { showError('bc-minor-rules.js did not load'); }
      else if (!window._loaded.divisions)  { showError('taba-divisions.js did not load'); }
      else if (!window._loaded.renderer)   { showError('renderer.js did not load'); }
      else if (!window.BCMinorRules)       { showError('BCMinorRules is not defined — bc-minor-rules.js may have a syntax error'); }
      else if (!window.TABADivisions)      { showError('TABADivisions is not defined — taba-divisions.js may have a syntax error'); }
      else if (!window.Rulebook)           { showError('Rulebook is not defined — renderer.js may have a syntax error'); }
      else {
        var params   = new URLSearchParams(window.location.search);
        var division = params.get('division');
        window.Rulebook.init(division).catch(err => showError(err.message));
      }
    } catch(err) {
      showError(err.message + '<br><small style="color:#999">' + (err.stack || '').replace(/\n/g,'<br>') + '</small>');
    }
  </script>

</body>
</html>
