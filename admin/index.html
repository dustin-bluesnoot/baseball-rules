<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TABA Rule Editor — Admin</title>
  <!-- Load base division data so the editor can show current values -->
  <script src="/js/taba-divisions.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f4f6f9; color: #1a1a2e; font-size: 14px; line-height: 1.5;
    }

    /* ── App shell ──────────────────────────────── */
    #admin-app { display: flex; flex-direction: column; min-height: 100vh; }

    header {
      background: #0d2240; color: #fff; padding: .7rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .header-left { display: flex; align-items: center; gap: .7rem; }
    .header-logo { font-size: 1.3rem; }
    header h1 { font-size: .95rem; font-weight: 700; }
    header .header-sub {
      font-size: .68rem; color: rgba(255,255,255,.45);
      font-weight: 400; margin-left: .5rem;
    }
    #logout-btn {
      background: rgba(255,255,255,.12); color: #fff;
      border: 1px solid rgba(255,255,255,.25); border-radius: 4px;
      padding: .28rem .7rem; font-size: .75rem; cursor: pointer;
      transition: background .15s;
    }
    #logout-btn:hover { background: rgba(255,255,255,.22); }

    /* ── Tabs ───────────────────────────────────── */
    .tab-bar {
      background: #fff; border-bottom: 2px solid #e4e7ef;
      padding: 0 1.5rem; display: flex;
    }
    .tab-btn {
      background: none; border: none; padding: .7rem 1.1rem;
      font-size: .85rem; font-weight: 500; cursor: pointer;
      color: #666; position: relative; transition: color .15s;
    }
    .tab-btn:hover { color: #0d2240; }
    .tab-btn.active { color: #0d2240; }
    .tab-btn.active::after {
      content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 2px; background: #0d2240;
    }

    /* ── Tab panes ──────────────────────────────── */
    .tab-pane { max-width: 860px; margin: 0 auto; padding: 1.5rem; width: 100%; }

    /* ── Toolbar ────────────────────────────────── */
    .toolbar {
      background: #fff; border: 1px solid #dde1eb; border-radius: 8px;
      padding: .8rem 1.1rem; margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
    }
    .toolbar label { font-size: .8rem; font-weight: 600; color: #555; }
    #div-select {
      background: #f8f9fc; border: 1px solid #c9d0df; border-radius: 5px;
      padding: .35rem .7rem; font-size: .85rem; color: #1a1a2e;
      min-width: 220px; cursor: pointer;
    }
    .toolbar-note {
      font-size: .73rem; color: #888; margin-left: auto;
      font-style: italic;
    }

    /* ── Section groups ─────────────────────────── */
    .section-group { margin-bottom: 1.5rem; }
    .section-group-title {
      font-size: .67rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: #888;
      padding: .25rem 0 .55rem; border-bottom: 1px solid #e4e7ef;
      margin-bottom: .75rem;
    }

    /* ── Rule cards (collapsible via <details>) ── */
    .rule-card {
      background: #fff; border: 1px solid #dde1eb; border-radius: 8px;
      margin-bottom: .55rem; overflow: hidden; transition: border-color .2s;
    }
    .rule-card.amended { border-color: #2ecc71; }

    .rule-card > summary {
      display: flex; align-items: center; gap: .6rem;
      padding: .7rem 1rem; cursor: pointer; user-select: none;
      list-style: none;
    }
    .rule-card > summary::-webkit-details-marker { display: none; }
    .rule-card > summary::before {
      content: '▶'; font-size: .5rem; color: #aaa; flex-shrink: 0;
      transition: transform .2s;
    }
    .rule-card[open] > summary::before { transform: rotate(90deg); }

    .card-badge {
      font-size: .6rem; font-weight: 600; padding: .1rem .4rem;
      border-radius: 3px; background: #e8eaf5; color: #444;
      letter-spacing: .04em; flex-shrink: 0; white-space: nowrap;
    }
    .card-rule-id {
      font-family: 'Menlo', 'Courier New', monospace;
      font-size: .67rem; color: #888; flex-shrink: 0;
    }
    .card-title { font-size: .88rem; font-weight: 600; flex: 1; }
    .amended-tag {
      font-size: .58rem; background: #d4f5e2; color: #1a7a4a;
      font-weight: 700; padding: .08rem .38rem; border-radius: 10px;
      letter-spacing: .05em; flex-shrink: 0;
    }

    /* ── Card body ──────────────────────────────── */
    .card-body {
      padding: 1rem 1.1rem 1.1rem;
      border-top: 1px solid #e4e7ef;
    }

    /* ── Form fields ────────────────────────────── */
    .field { margin-bottom: .9rem; }
    .field:last-of-type { margin-bottom: 0; }

    .field label {
      display: block; font-size: .68rem; font-weight: 700; color: #555;
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: .28rem;
    }
    .field input[type="text"],
    .field textarea {
      width: 100%; border: 1px solid #c9d0df; border-radius: 5px;
      padding: .42rem .65rem; font-size: .83rem; color: #1a1a2e;
      font-family: inherit; background: #fafbfd;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input[type="text"]:focus,
    .field textarea:focus {
      outline: none; border-color: #0d2240;
      box-shadow: 0 0 0 3px rgba(13,34,64,.08);
      background: #fff;
    }
    .field textarea {
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: .74rem; resize: vertical; min-height: 90px;
    }
    .field textarea.content-area { min-height: 200px; }
    .field .hint { font-size: .7rem; color: #888; margin-top: .22rem; }

    /* ── HTML preview ───────────────────────────── */
    .preview-wrap { margin-bottom: .5rem; }
    .btn-preview {
      background: none; border: 1px solid #c9d0df; border-radius: 4px;
      padding: .18rem .55rem; font-size: .7rem; cursor: pointer; color: #555;
      transition: background .15s;
    }
    .btn-preview:hover { background: #f0f2f8; }
    .preview-pane {
      display: none; margin-top: .4rem;
      border: 1px solid #c9d0df; border-radius: 5px;
      padding: .7rem .9rem; background: #fafbfd;
      font-size: .84rem; line-height: 1.6;
      max-height: 260px; overflow-y: auto;
    }
    .preview-pane.visible { display: block; }

    /* ── Card actions ───────────────────────────── */
    .card-actions {
      display: flex; align-items: center; gap: .55rem;
      margin-top: .9rem; flex-wrap: wrap;
    }
    .btn-save {
      background: #0d2240; color: #fff; border: none; border-radius: 5px;
      padding: .42rem 1rem; font-size: .8rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .btn-save:hover:not(:disabled) { background: #163462; }
    .btn-save:disabled { opacity: .5; cursor: default; }

    .btn-revert {
      background: none; color: #c0392b; border: 1px solid #f5c0b8;
      border-radius: 5px; padding: .38rem .85rem; font-size: .75rem;
      cursor: pointer; transition: background .15s;
    }
    .btn-revert:hover:not(:disabled) { background: #fff4f4; }
    .btn-revert:disabled { opacity: .5; cursor: default; }

    .save-status { font-size: .75rem; }
    .save-status.ok  { color: #27ae60; }
    .save-status.err { color: #c0392b; }

    /* ── Editor toolbar ─────────────────────────── */
    .editor-toolbar { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 5px; }
    .tb-btn {
      background: #f0f2f8; border: 1px solid #c9d0df; border-radius: 3px;
      padding: 1px 7px; font-size: .7rem; cursor: pointer; color: #1a1a2e;
      font-family: inherit; line-height: 1.7; transition: background .12s;
    }
    .tb-btn:hover { background: #dde1eb; }
    .tb-sep { display: inline-block; width: 1px; background: #c9d0df; margin: 2px 2px; align-self: stretch; }
    .editor-preview-label {
      font-size: .6rem; font-weight: 700; color: #888;
      text-transform: uppercase; letter-spacing: .08em;
      margin-top: 6px; margin-bottom: 3px;
    }
    .editor-preview-live {
      border: 1px solid #c9d0df; border-radius: 4px;
      padding: 8px 10px; background: #fafbfd;
      font-size: .82rem; line-height: 1.6;
      min-height: 40px; max-height: 240px; overflow-y: auto;
    }

    /* ── Audit log ──────────────────────────────── */
    .audit-entry {
      background: #fff; border: 1px solid #dde1eb; border-radius: 8px;
      padding: .8rem 1.1rem; margin-bottom: .55rem;
    }
    .audit-msg { font-size: .86rem; font-weight: 600; margin-bottom: .2rem; }
    .audit-meta { font-size: .72rem; color: #888; display: flex; gap: .4rem; flex-wrap: wrap; }
    .audit-sha { font-family: 'Menlo', monospace; background: #f0f2f8; padding: .05rem .3rem; border-radius: 3px; }
    .audit-link { color: #1a5276; text-decoration: none; }
    .audit-link:hover { text-decoration: underline; }

    .empty-msg { color: #888; font-size: .86rem; text-align: center; padding: 2.5rem 1rem; }

    /* ── Amendment ref ──────────────────────────── */
    .amendment-ref {
      font-size: .72rem; color: #555; padding: .45rem .7rem;
      background: #f0fff4; border-radius: 5px; margin-bottom: .9rem;
      border-left: 3px solid #2ecc71;
    }

    /* ── Audit log ──────────────────────────────── */
    .audit-header {
      display: flex; align-items: center; gap: .55rem; flex-wrap: wrap;
    }
    .audit-action {
      font-size: .62rem; font-weight: 700; padding: .1rem .38rem;
      border-radius: 3px; letter-spacing: .04em; flex-shrink: 0;
    }
    .audit-action.update { background: #dceeff; color: #1a4a8a; }
    .audit-action.revert { background: #ffe8e8; color: #8b0000; }
    .audit-section { font-size: .82rem; font-weight: 600; flex: 1; min-width: 0; }
    .audit-date { font-size: .72rem; color: #888; white-space: nowrap; }
    .audit-diff { margin-top: .45rem; }
    .audit-diff > summary {
      font-size: .75rem; color: #555; cursor: pointer;
      padding: .15rem 0; list-style: none; display: inline-block;
    }
    .audit-diff > summary::before { content: '▶ '; font-size: .5rem; }
    .audit-diff[open] > summary::before { content: '▼ '; }
    .diff-field { margin-top: .55rem; }
    .diff-field-name {
      font-family: 'Menlo', monospace; font-size: .68rem;
      background: #f0f2f8; padding: .08rem .3rem; border-radius: 2px;
      color: #444; font-weight: 600;
    }
    .diff-row { display: flex; gap: .45rem; margin-top: .25rem; align-items: flex-start; }
    .diff-label {
      font-size: .6rem; font-weight: 700; padding: .1rem .3rem;
      border-radius: 2px; flex-shrink: 0; margin-top: .05rem; letter-spacing: .03em;
    }
    .diff-label.before { background: #ffe8e8; color: #8b0000; }
    .diff-label.after  { background: #d4f5e2; color: #1a7a4a; }
    .diff-text {
      font-family: 'Menlo', monospace; font-size: .71rem; color: #333;
      word-break: break-word; white-space: pre-wrap;
      max-height: 120px; overflow-y: auto;
    }
  </style>
</head>
<body>

<!-- ── Admin application ────────────────────────────────────── -->
<div id="admin-app" hidden>

  <header>
    <div class="header-left">
      <span class="header-logo">⚾</span>
      <h1>TABA Rule Editor <span class="header-sub">Admin</span></h1>
    </div>
    <button id="logout-btn">Log out</button>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="audit">Audit Log</button>
    <button class="tab-btn" data-tab="editor">Rule Editor</button>
  </div>

  <div id="tab-audit" class="tab-pane">
    <div id="audit-content"><p class="empty-msg">Loading audit log…</p></div>
  </div>

  <div id="tab-editor" class="tab-pane" hidden>
    <div class="toolbar">
      <label for="div-select">Division</label>
      <select id="div-select"></select>
      <span class="toolbar-note">Changes go live immediately on the next page load.</span>
    </div>
    <div id="editor-content"></div>
  </div>


</div>

<script>
/* ════════════════════════════════════════════════════════════
   State
   ════════════════════════════════════════════════════════════ */
let baseData   = {};  // deep-cloned window.TABADivisions (unmodified base)
let amendments = {};  // fetched from amendments.json
let cardSeq    = 0;

/* ════════════════════════════════════════════════════════════
   Auth — token comes from main page login (localStorage)
   ════════════════════════════════════════════════════════════ */
function storedToken() { return localStorage.getItem('adminToken') || ''; }
function authHeaders() { return { 'Authorization': `Bearer ${storedToken()}` }; }

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('adminToken');
  location.href = '/';
});

// On load: verify token and enter app, or redirect to main page to log in
(async () => {
  const token = storedToken();
  if (!token) { location.href = '/'; return; }
  try {
    const res = await fetch('/api/audit-log?nc=' + Date.now(), { headers: authHeaders() });
    if (res.ok) { await enterApp(); return; }
    if (res.status === 401) localStorage.removeItem('adminToken');
  } catch { /* network error — fall through */ }
  location.href = '/';
})();

/* ════════════════════════════════════════════════════════════
   App entry point
   ════════════════════════════════════════════════════════════ */
async function enterApp() {
  document.getElementById('admin-app').hidden = false;
  loadAuditLog();
}

async function renderEditorInit() {
  baseData = JSON.parse(JSON.stringify(window.TABADivisions));
  await loadAmendments();
  const sel = document.getElementById('div-select');
  if (sel.options.length) { renderEditor(sel.value); return; }
  Object.entries(baseData).forEach(([key, div]) => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = `${div.badge} — ${div.name}`;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => renderEditor(sel.value));
  renderEditor(sel.value);
}

/* ════════════════════════════════════════════════════════════
   Load amendments.json
   ════════════════════════════════════════════════════════════ */
async function loadAmendments() {
  try {
    const r = await fetch('/api/amendments?nc=' + Date.now());
    amendments = r.ok ? await r.json() : {};
  } catch {
    amendments = {};
  }
}

/* ════════════════════════════════════════════════════════════
   Helpers: amendments access
   ════════════════════════════════════════════════════════════ */
function amended(divKey, sectionType, sectionId) {
  return !!(amendments?.[divKey]?.[sectionType]?.[sectionId]);
}

function effectiveVal(divKey, sectionType, sectionId, field, fallback) {
  return amendments?.[divKey]?.[sectionType]?.[sectionId]?.[field] ?? fallback;
}

/* ════════════════════════════════════════════════════════════
   Render editor for a division
   ════════════════════════════════════════════════════════════ */
function renderEditor(divKey) {
  const div = baseData[divKey];
  const el  = document.getElementById('editor-content');
  let html  = '';

  // TABA additions
  const additions = div.additions || [];
  if (additions.length) {
    html += `<div class="section-group">
      <div class="section-group-title">TABA Local Rules — Additions</div>`;
    additions.forEach(a => {
      html += buildAdditionCard(divKey, a);
    });
    html += `</div>`;
  }

  // BC Minor overrides
  const overrideEntries = Object.entries(div.overrides || {});
  if (overrideEntries.length) {
    html += `<div class="section-group">
      <div class="section-group-title">BC Minor Overrides</div>`;
    overrideEntries.forEach(([ruleId, ov]) => {
      html += buildOverrideCard(divKey, ruleId, ov);
    });
    html += `</div>`;
  }

  if (!html) html = '<p class="empty-msg">No editable sections for this division.</p>';
  el.innerHTML = html;
  attachCardListeners(el, divKey);
}

/* ── Build addition card ────────────────────────────────────── */
function buildAdditionCard(divKey, addition) {
  const cid  = 'c' + (++cardSeq);
  const sid  = addition.id;
  const type = 'additions';
  const isAmended = amended(divKey, type, sid);
  const meta = amendments?.[divKey]?.[type]?.[sid]?._meta;

  const badge   = effectiveVal(divKey, type, sid, 'badge',   addition.badge   || '');
  const content = effectiveVal(divKey, type, sid, 'content', addition.content || '');

  const metaBlock = meta ? `<div class="amendment-ref">Last amended ${fmtDate(meta.updated)}</div>` : '';

  return `
    <details class="rule-card${isAmended ? ' amended' : ''}" id="${cid}-details">
      <summary>
        <span class="card-badge">${escH(badge)}</span>
        <span class="card-title">${escH(addition.title)}</span>
        ${isAmended ? '<span class="amended-tag">AMENDED</span>' : ''}
      </summary>
      <div class="card-body">
        ${metaBlock}
        ${fieldText(cid, 'badge', 'Badge label', badge, 'Short label shown in the rule header.')}
        ${fieldContent(cid, 'content', content)}
        ${actions(cid, divKey, type, sid, 'badge,content', isAmended)}
      </div>
    </details>`;
}

/* ── Build override card ────────────────────────────────────── */
function buildOverrideCard(divKey, ruleId, ov) {
  const cid  = 'c' + (++cardSeq);
  const type = 'overrides';
  const isAmended = amended(divKey, type, ruleId);
  const meta = amendments?.[divKey]?.[type]?.[ruleId]?._meta;

  const label      = effectiveVal(divKey, type, ruleId, 'label',         ov.label         || ruleId);
  const bcMinorSum = effectiveVal(divKey, type, ruleId, 'bcMinorSummary', ov.bcMinorSummary || '');
  const tabaSum    = effectiveVal(divKey, type, ruleId, 'tabaSummary',   ov.tabaSummary   || '');
  const content    = effectiveVal(divKey, type, ruleId, 'content',       ov.content       || '');

  const metaBlock = meta ? `<div class="amendment-ref">Last amended ${fmtDate(meta.updated)}</div>` : '';

  return `
    <details class="rule-card${isAmended ? ' amended' : ''}" id="${cid}-details">
      <summary>
        <span class="card-rule-id">${escH(ruleId)}</span>
        <span class="card-title">${escH(label)}</span>
        ${isAmended ? '<span class="amended-tag">AMENDED</span>' : ''}
      </summary>
      <div class="card-body">
        ${metaBlock}
        ${fieldText(cid, 'label', 'Override panel label', label, '')}
        ${fieldTextarea(cid, 'bcMinorSummary', 'BC Minor Summary (left column)', bcMinorSum)}
        ${fieldTextarea(cid, 'tabaSummary',    'TABA Summary (right column header)', tabaSum)}
        ${fieldContent(cid, 'content', content)}
        ${actions(cid, divKey, type, ruleId, 'label,bcMinorSummary,tabaSummary,content', isAmended)}
      </div>
    </details>`;
}

/* ── Field helpers ──────────────────────────────────────────── */
function fieldText(cid, field, label, value, hint) {
  return `<div class="field">
    <label>${label}</label>
    <input type="text" id="${cid}-${field}" value="${escA(value)}">
    ${hint ? `<p class="hint">${hint}</p>` : ''}
  </div>`;
}

function fieldTextarea(cid, field, label, value) {
  return `<div class="field">
    <label>${label}</label>
    <textarea id="${cid}-${field}">${escT(value)}</textarea>
  </div>`;
}

const SNIPS = {
  'callout-blue':  '<div class="callout blue">\n  <p>Text here.</p>\n</div>',
  'callout-red':   '<div class="callout red">\n  <p><strong>Note:</strong> Text here.</p>\n</div>',
  'callout-navy':  '<div class="callout navy">\n  <p><strong>Heading:</strong></p>\n  <ol class="nl">\n    <li>Item one</li>\n    <li>Item two</li>\n  </ol>\n</div>',
  'ul':            '<ul class="rl">\n  <li>Item one</li>\n  <li>Item two</li>\n</ul>',
  'ol':            '<ol class="nl">\n  <li>Item one</li>\n  <li>Item two</li>\n</ol>',
  'table':         '<table>\n  <thead><tr><th>Column</th><th>Value</th></tr></thead>\n  <tbody>\n    <tr><td class="hi">Row 1</td><td>Value</td></tr>\n  </tbody>\n</table>',
  'sub-rule':      '<div class="sub-rule">\n  <div class="sub-rule-title">Section Title</div>\n  <p>Content here.</p>\n</div>',
  'note':          '<p class="note">Additional note here.</p>',
};

function _insertAt(ta, text) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.dispatchEvent(new Event('input')); ta.focus();
}
function _wrap(ta, before, after) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e) || 'text';
  const rep = before + sel + after;
  ta.value = ta.value.slice(0, s) + rep + ta.value.slice(e);
  ta.selectionStart = s; ta.selectionEnd = s + rep.length;
  ta.dispatchEvent(new Event('input')); ta.focus();
}

function fieldContent(cid, field, value) {
  const taId = `${cid}-${field}`;
  const preId = `${taId}-preview`;
  return `<div class="field">
    <label>Content (HTML)</label>
    <div class="editor-toolbar">
      <button type="button" class="tb-btn" data-ta="${taId}" data-wrap-b="&lt;strong&gt;" data-wrap-a="&lt;/strong&gt;">Bold</button>
      <button type="button" class="tb-btn" data-ta="${taId}" data-wrap-b='&lt;a href="#" class="bcm-link"&gt;' data-wrap-a="&lt;/a&gt;">BC Link</button>
      <span class="tb-sep"></span>
      <button type="button" class="tb-btn" data-ta="${taId}" data-snip="callout-blue">Callout blue</button>
      <button type="button" class="tb-btn" data-ta="${taId}" data-snip="callout-red">Callout red</button>
      <button type="button" class="tb-btn" data-ta="${taId}" data-snip="callout-navy">Callout navy</button>
      <span class="tb-sep"></span>
      <button type="button" class="tb-btn" data-ta="${taId}" data-snip="ul">Bullet list</button>
      <button type="button" class="tb-btn" data-ta="${taId}" data-snip="ol">Numbered list</button>
      <button type="button" class="tb-btn" data-ta="${taId}" data-snip="table">Table</button>
      <span class="tb-sep"></span>
      <button type="button" class="tb-btn" data-ta="${taId}" data-snip="sub-rule">Sub-rule</button>
      <button type="button" class="tb-btn" data-ta="${taId}" data-snip="note">Note</button>
    </div>
    <textarea id="${taId}" class="content-area">${escT(value)}</textarea>
    <div class="editor-preview-label">Preview</div>
    <div class="editor-preview-live" id="${preId}">${value}</div>
  </div>`;
}

function actions(cid, divKey, type, sectionId, fields, isAmended) {
  const revert = isAmended
    ? `<button class="btn-revert"
         data-div="${divKey}" data-type="${type}" data-id="${sectionId}" data-cid="${cid}">
         Revert to original
       </button>`
    : '';
  return `<div class="card-actions">
    <button class="btn-save"
      data-div="${divKey}" data-type="${type}" data-id="${sectionId}"
      data-cid="${cid}" data-fields="${fields}">
      Save changes
    </button>
    ${revert}
    <span class="save-status" id="${cid}-status"></span>
  </div>`;
}

/* ════════════════════════════════════════════════════════════
   Event listeners
   ════════════════════════════════════════════════════════════ */
function attachCardListeners(container, divKey) {
  // Live preview — update as you type
  container.querySelectorAll('.content-area').forEach(ta => {
    const preview = document.getElementById(ta.id + '-preview');
    if (preview) ta.addEventListener('input', () => { preview.innerHTML = ta.value; });
  });

  // Toolbar snippet / wrap buttons
  container.querySelectorAll('.tb-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const ta = document.getElementById(btn.dataset.ta);
      if (!ta) return;
      if (btn.dataset.snip) _insertAt(ta, SNIPS[btn.dataset.snip] || '');
      if (btn.dataset.wrapB) _wrap(ta,
        btn.dataset.wrapB.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'),
        btn.dataset.wrapA.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'));
    });
  });

  // Save buttons
  container.querySelectorAll('.btn-save').forEach(btn => {
    btn.addEventListener('click', () => handleSave(btn, divKey));
  });

  // Revert buttons
  container.querySelectorAll('.btn-revert').forEach(btn => {
    btn.addEventListener('click', () => handleRevert(btn, divKey));
  });
}

/* ════════════════════════════════════════════════════════════
   Save handler
   ════════════════════════════════════════════════════════════ */
async function handleSave(btn, divKey) {
  const { div, type: sectionType, id: sectionId, cid, fields } = btn.dataset;
  const statusEl = document.getElementById(cid + '-status');
  btn.disabled = true;
  statusEl.textContent = 'Saving…';
  statusEl.className = 'save-status';

  const changes = {};
  fields.split(',').forEach(f => {
    const el = document.getElementById(cid + '-' + f);
    if (el) changes[f] = el.value;
  });

  try {
    const res = await fetch('/api/save-amendment', {
      method: 'POST',
      headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ divisionKey: div, sectionType, sectionId, changes }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Server error ${res.status}`);
    }

    // Update local amendments cache
    if (!amendments[div])                          amendments[div] = {};
    if (!amendments[div][sectionType])             amendments[div][sectionType] = {};
    if (!amendments[div][sectionType][sectionId])  amendments[div][sectionType][sectionId] = {};
    Object.assign(amendments[div][sectionType][sectionId], changes);
    amendments[div][sectionType][sectionId]._meta = { updated: new Date().toISOString(), author: 'admin' };

    // Mark card visually
    const details = document.getElementById(cid + '-details');
    if (details && !details.classList.contains('amended')) {
      details.classList.add('amended');
      const titleEl = details.querySelector('.card-title');
      if (titleEl && !details.querySelector('.amended-tag')) {
        titleEl.insertAdjacentHTML('afterend', '<span class="amended-tag">AMENDED</span>');
      }
    }

    statusEl.textContent = '✓ Saved — live on next page load.';
    statusEl.className = 'save-status ok';
  } catch (err) {
    statusEl.textContent = '✗ ' + err.message;
    statusEl.className = 'save-status err';
  } finally {
    btn.disabled = false;
  }
}

/* ════════════════════════════════════════════════════════════
   Revert handler
   ════════════════════════════════════════════════════════════ */
async function handleRevert(btn, divKey) {
  const { div, type: sectionType, id: sectionId, cid } = btn.dataset;
  if (!confirm(`Remove all amendments for "${sectionId}" and revert to the original wording?`)) return;

  const statusEl = document.getElementById(cid + '-status');
  btn.disabled = true;
  statusEl.textContent = 'Reverting…';
  statusEl.className = 'save-status';

  try {
    const res = await fetch('/api/revert-amendment', {
      method: 'POST',
      headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ divisionKey: div, sectionType, sectionId }),
    });

    if (!res.ok) throw new Error(`Server error ${res.status}`);

    // Remove from local cache
    delete amendments?.[div]?.[sectionType]?.[sectionId];

    statusEl.textContent = '✓ Reverted — re-rendering…';
    statusEl.className = 'save-status ok';

    // Re-render to show original values
    setTimeout(() => renderEditor(document.getElementById('div-select').value), 600);
  } catch (err) {
    statusEl.textContent = '✗ ' + err.message;
    statusEl.className = 'save-status err';
    btn.disabled = false;
  }
}

/* ════════════════════════════════════════════════════════════
   Audit log
   ════════════════════════════════════════════════════════════ */
function truncate(str, max) {
  const s = str == null ? '' : String(str);
  return s.length > max ? s.slice(0, max) + '…' : s;
}

async function loadAuditLog() {
  const el = document.getElementById('audit-content');
  el.innerHTML = '<p class="empty-msg">Loading…</p>';
  try {
    const res = await fetch('/api/audit-log', { headers: authHeaders() });
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const entries = await res.json();

    if (!entries.length) {
      el.innerHTML = '<p class="empty-msg">No amendments recorded yet. All rules are at their original values.</p>';
      return;
    }

    el.innerHTML = entries.map(e => {
      const date        = new Date(e.timestamp).toLocaleString('en-CA', { dateStyle: 'medium', timeStyle: 'short' });
      const actionLabel = e.action === 'revert' ? 'Reverted' : 'Updated';

      const diffHtml = (e.changedFields || []).map(f => {
        const beforeVal = e.before?.[f] === null ? '(not previously set)' : truncate(e.before?.[f], 400);
        const afterVal  = e.action === 'revert' ? '(reverted to original)' : truncate(e.after?.[f], 400);
        return `<div class="diff-field">
          <span class="diff-field-name">${escH(f)}</span>
          <div class="diff-row">
            <span class="diff-label before">Before</span>
            <span class="diff-text">${escH(beforeVal)}</span>
          </div>
          <div class="diff-row">
            <span class="diff-label after">After</span>
            <span class="diff-text">${escH(afterVal)}</span>
          </div>
        </div>`;
      }).join('');

      return `<div class="audit-entry">
        <div class="audit-header">
          <span class="audit-action ${escH(e.action)}">${escH(actionLabel)}</span>
          <span class="audit-section">${escH(e.divisionKey)} / ${escH(e.sectionId)}</span>
          <span class="audit-date">${date}</span>
        </div>
        <details class="audit-diff">
          <summary>Show changes (${escH((e.changedFields || []).join(', '))})</summary>
          ${diffHtml}
        </details>
      </div>`;
    }).join('');
  } catch (err) {
    el.innerHTML = `<p class="empty-msg" style="color:#c0392b">Failed to load: ${escH(err.message)}</p>`;
  }
}

/* ════════════════════════════════════════════════════════════
   Tab switching
   ════════════════════════════════════════════════════════════ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-editor').hidden = (tab !== 'editor');
    document.getElementById('tab-audit').hidden  = (tab !== 'audit');
    if (tab === 'editor' && !document.getElementById('div-select').options.length) renderEditorInit();
  });
});

/* ════════════════════════════════════════════════════════════
   Escape helpers
   ════════════════════════════════════════════════════════════ */
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escT(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-CA', { year: 'numeric', month: 'long', day: 'numeric' });
}
